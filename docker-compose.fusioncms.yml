services:
  ac-worldserver:
    volumes:
      - ./modules:/azerothcore/modules:ro

  fusion-db:
    image: mysql:8.4
    command: "mysqld --mysql-native-password=ON --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${FUSIONCMS_DB_ROOT_PASSWORD:-fusionroot}
      MYSQL_DATABASE: ${FUSIONCMS_DB_NAME:-fusioncms}
      MYSQL_USER: ${FUSIONCMS_DB_USER:-fusioncms}
      MYSQL_PASSWORD: ${FUSIONCMS_DB_PASSWORD:-fusioncms}
    volumes:
      - fusioncms-db:/var/lib/mysql
    networks:
      - fusioncms-private
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      interval: 5s
      timeout: 10s
      retries: 30

  fusion-php:
    restart: unless-stopped
    build:
      context: ./config/fusioncms/php
      dockerfile: Dockerfile
    depends_on:
      fusion-db:
        condition: service_healthy
      ac-database:
        condition: service_healthy
    environment:
      CI_ENVIRONMENT: production
      FUSIONCMS_URL: ${FUSIONCMS_URL:-http://localhost:8080}
      FUSION_INSTALL_BASE: http://fusion-web
      FUSIONCMS_TITLE: ${FUSIONCMS_TITLE:-Fusion AzerothCore}
      FUSIONCMS_SERVER_NAME: ${FUSIONCMS_SERVER_NAME:-AzerothCore}
      FUSIONCMS_REALMLIST: ${FUSIONCMS_REALMLIST:-localhost}
      FUSIONCMS_REALM_NAME: ${FUSIONCMS_REALM_NAME:-AzerothCore}
      FUSIONCMS_DESCRIPTION: ${FUSIONCMS_DESCRIPTION:-A modern AzerothCore portal powered by FusionCMS.}
      FUSIONCMS_KEYWORDS: ${FUSIONCMS_KEYWORDS:-azerothcore,wotlk,wow,private server}
      FUSIONCMS_OWNER_ACCOUNT: ${FUSIONCMS_OWNER_ACCOUNT:-ADMIN}
      FUSIONCMS_SECURITY_CODE: ${FUSIONCMS_SECURITY_CODE:-FusionAdmin123}
      FUSIONCMS_DB_HOST: fusion-db
      FUSIONCMS_DB_PORT: 3306
      FUSIONCMS_DB_NAME: ${FUSIONCMS_DB_NAME:-fusioncms}
      FUSIONCMS_DB_USER: ${FUSIONCMS_DB_USER:-fusioncms}
      FUSIONCMS_DB_PASSWORD: ${FUSIONCMS_DB_PASSWORD:-fusioncms}
      ACORE_DB_HOST: ac-database
      ACORE_DB_PORT: 3306
      ACORE_DB_USER: root
      ACORE_DB_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-password}
      ACORE_AUTH_DB: acore_auth
      ACORE_CHAR_DB: acore_characters
      ACORE_WORLD_DB: acore_world
      ACORE_WORLD_HOST: ac-worldserver
      ACORE_WORLD_PORT: 8085
      ACORE_SOAP_HOST: ac-worldserver
      ACORE_SOAP_PORT: 7878
      ACORE_SOAP_USER: ${FUSIONCMS_SOAP_USER:-CMSSOAP}
      ACORE_SOAP_PASSWORD: ${FUSIONCMS_SOAP_PASSWORD:-CmsSoap123}
      TZ: ${TZ:-UTC}
    volumes:
      - ./apps/fusioncms:/var/www/html
    networks:
      - fusioncms-private
      - ac-network

  fusion-web:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      - fusion-php
    volumes:
      - ./apps/fusioncms:/var/www/html:ro
      - ./config/fusioncms/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${FUSIONCMS_HTTP_PORT:-8080}:80
    networks:
      - fusioncms-private

volumes:
  fusioncms-db:

networks:
  fusioncms-private:
